# Receiver job. Connects to the sender service, receives the configured number
# of tables and writes the benchmark result to standard output. `run.sh`
# substitutes the template variables before applying the manifest.
#
# Required pod anti-affinity places the receiver on a different node from the
# sender so traffic crosses the network rather than the local loopback path.
apiVersion: batch/v1
kind: Job
metadata:
  name: bench-receiver
  namespace: ${NAMESPACE}
  labels:
    app: bench
    role: receiver
spec:
  backoffLimit: 2
  completions: 1
  template:
    metadata:
      labels:
        app: bench
        role: receiver
    spec:
      restartPolicy: Never
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: bench
                  role: sender
              topologyKey: kubernetes.io/hostname
      containers:
        - name: receiver
          image: ${IMAGE}
          imagePullPolicy: Always
          command: ["bench_receiver"]
          args:
            - "--connect"
            - "bench-sender.${NAMESPACE}.svc.cluster.local:${PORT}"
            - "--shape"
            - "${SHAPE}"
            - "--rows"
            - "${ROWS}"
            - "--batches"
            - "${BATCHES}"
