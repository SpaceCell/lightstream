# Sender deployment and ClusterIP service. The receiver connects to the service
# by DNS. `run.sh` substitutes the template variables before applying the
# manifest.
#
# The sender accepts one connection, sends the configured number of tables and
# exits. The deployment may restart the pod after the benchmark completes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-sender
  namespace: ${NAMESPACE}
  labels:
    app: bench
    role: sender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bench
      role: sender
  template:
    metadata:
      labels:
        app: bench
        role: sender
    spec:
      containers:
        - name: sender
          image: ${IMAGE}
          imagePullPolicy: Always
          command: ["bench_sender"]
          args:
            - "--bind"
            - "0.0.0.0:${PORT}"
            - "--shape"
            - "${SHAPE}"
            - "--rows"
            - "${ROWS}"
            - "--batches"
            - "${BATCHES}"
          ports:
            - containerPort: ${PORT}
              name: bench
---
apiVersion: v1
kind: Service
metadata:
  name: bench-sender
  namespace: ${NAMESPACE}
  labels:
    app: bench
    role: sender
spec:
  selector:
    app: bench
    role: sender
  ports:
    - name: bench
      port: ${PORT}
      targetPort: ${PORT}